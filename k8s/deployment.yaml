apiVersion: apps/v1
kind: Deployment
metadata:
  name: shardfield
spec:
  replicas: 1            # matches live in memory: keep exactly one replica
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # lets the non-root user write to the data volume
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: shardfield
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shardfield-data
        - name: code
          configMap:
            name: shardfield-code
            items:
              - { key: server.js, path: server.js }
              - { key: sim.js, path: public/sim.js }
              - { key: index.html, path: public/index.html }
