<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shardfield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Single-theme dark vector-monitor look. Fonts fall back cleanly if Google Fonts is blocked. */
:root {
  color-scheme: dark;
  --void: #05070d; --field: #080c16; --line: #d6e6ff; --dim: #6f7f9c;
  --amber: #ffb547; --danger: #ff6b6b; --edge: #2a3550;
  --font-display: "Chakra Petch", "Eurostile", "Trebuchet MS", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--void); color: var(--line); font-family: var(--font-mono); font-size: 14px;
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
}
[hidden] { display: none !important; }
#game { display: block; width: 100%; height: 100%; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(5,7,13,.55);
}
.panel { text-align: center; display: grid; gap: 18px; justify-items: center; max-width: 34rem; }
.panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.6rem, 9vw, 5rem); letter-spacing: .18em; padding-left: .18em; line-height: 1;
  text-shadow: 0 0 18px rgba(214,230,255,.35);
}
.panel p { margin: 0; color: var(--dim); line-height: 1.6; font-size: .9rem; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(100%, 26rem); }
.fields label { display: grid; gap: 6px; text-align: left; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.fields input {
  font: 500 1rem var(--font-mono); color: var(--line); background: var(--field);
  border: 1px solid var(--edge); border-radius: 2px; padding: 10px 12px; width: 100%; user-select: text; -webkit-user-select: text;
}
.fields input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.keys { display: grid; grid-template-columns: auto auto; gap: 6px 18px; font-size: .82rem; color: var(--dim); text-align: left; }
.keys kbd { font-family: var(--font-mono); color: var(--line); border: 1px solid var(--edge); border-radius: 3px; padding: 1px 6px; font-size: .78rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn {
  font: 700 1rem var(--font-display); letter-spacing: .22em; text-transform: uppercase;
  color: var(--void); background: var(--amber); border: 0; border-radius: 2px; padding: 12px 28px; cursor: pointer;
}
.btn.ghost { background: none; color: var(--line); border: 1px solid var(--edge); }
.btn:focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }
.error { color: var(--danger); font-size: .85rem; min-height: 1.2em; }

#share {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center;
}
.chip {
  background: rgba(8,12,22,.8); border: 1px solid var(--edge); color: var(--dim); border-radius: 3px;
  font: 500 .7rem var(--font-mono); padding: 4px 8px; letter-spacing: .1em; cursor: pointer;
}
.chip:focus-visible { outline: 2px solid var(--line); }
#net { cursor: default; }

/* Leaderboard: same component in the menu and as an in-game overlay */
.overlay { overflow-y: auto; }
.lb { width: min(100%, 26rem); display: grid; gap: 10px; text-align: left; }
.lb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lb-head h2 { margin: 0; font: 700 .8rem var(--font-display); letter-spacing: .24em; text-transform: uppercase; color: var(--line); }
.lb-tabs { display: flex; gap: 4px; }
.lb-tabs button {
  font: 500 .68rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
  background: none; border: 1px solid transparent; border-radius: 2px; padding: 3px 7px; cursor: pointer;
}
.lb-tabs button[aria-pressed="true"] { color: var(--line); border-color: var(--edge); }
.lb-tabs button:focus-visible { outline: 2px solid var(--amber); }
.lb ol { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--edge); }
.lb li {
  display: grid; grid-template-columns: 2ch 1fr auto auto; gap: 14px; align-items: baseline;
  padding: 6px 2px; border-bottom: 1px solid rgba(42,53,80,.6); font-size: .85rem; font-variant-numeric: tabular-nums;
}
.lb li .rk { color: var(--dim); text-align: right; }
.lb li .nm { color: var(--line); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb li .rd { color: var(--dim); font-size: .72rem; }
.lb li .sc { color: var(--line); font-family: var(--font-display); font-weight: 700; }
.lb li:first-child .sc, .lb li:first-child .nm { color: var(--amber); }
.lb li.me .nm::after { content: " ·  DU"; color: var(--dim); font-size: .7rem; }
.lb .empty { color: var(--dim); font-size: .85rem; padding: 10px 2px; }
#lbOverlay .panel { background: rgba(5,7,13,.92); border: 1px solid var(--edge); padding: 24px; }

#pad {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
#pad .grp { display: flex; gap: 12px; pointer-events: auto; }
#pad button {
  width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid rgba(214,230,255,.35); background: rgba(8,12,22,.55);
  color: var(--line); font: .7rem var(--font-mono); letter-spacing: .08em; touch-action: none;
}
#pad button.on { background: rgba(255,181,71,.25); border-color: var(--amber); }
</style>
</head>
<body>
<canvas id="game" aria-label="Shardfield spelplan"></canvas>

<div class="overlay" id="menu">
  <form class="panel" id="joinForm" autocomplete="off">
    <h1>SHARDFIELD</h1>
    <p>Rensa bältet tillsammans. Varje sten du träffar spricker i mindre, snabbare skärvor. Alla med samma rumslänk hamnar i samma match.</p>
    <div class="fields">
      <label for="nameIn">Ditt namn<input id="nameIn" maxlength="12" placeholder="PILOT"></label>
      <label for="roomIn">Rum<input id="roomIn" maxlength="24" placeholder="lobby"></label>
    </div>
    <div class="keys">
      <span><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd></span><span>Rotera</span>
      <span><kbd>↑</kbd> / <kbd>W</kbd></span><span>Gasa</span>
      <span><kbd>Space</kbd></span><span>Skjut</span>
      <span><kbd>M</kbd> · <kbd>L</kbd></span><span>Ljud · Topplista</span>
    </div>
    <div class="row">
      <button class="btn" id="joinBtn" type="submit">Gå med</button>
      <button class="btn ghost" id="soloBtn" type="button">Spela solo</button>
    </div>
    <div class="error" id="err" role="status"></div>
    <section class="lb" id="lbMenu" aria-label="Topplista"></section>
  </form>
</div>

<div class="overlay" id="lbOverlay" hidden>
  <div class="panel">
    <section class="lb" id="lbGame" aria-label="Topplista"></section>
    <span class="hint" style="font-size:.72rem;color:var(--dim);letter-spacing:.12em">TRYCK L FÖR ATT STÄNGA</span>
  </div>
</div>

<div id="share" hidden>
  <button class="chip" id="lbBtn" type="button">TOPPLISTA</button>
  <span class="chip" id="net">—</span>
  <button class="chip" id="copy" type="button">KOPIERA LÄNK</button>
  <button class="chip" id="mute" type="button">LJUD AV</button>
</div>

<div id="pad" hidden>
  <div class="grp">
    <button data-bit="2" aria-label="Rotera vänster">◀</button>
    <button data-bit="4" aria-label="Rotera höger">▶</button>
  </div>
  <div class="grp">
    <button data-bit="1" aria-label="Gasa">GAS</button>
    <button data-bit="8" aria-label="Skjut">SKJUT</button>
  </div>
</div>

<script src="sim.js"></script>
<script>
"use strict";
/* =====================================================================
   SESSIONS — same surface for local and networked play:
   setInput(bits) · update(dt) · view(now) → world-shaped object · localId
   ===================================================================== */
class LocalSession {
  constructor() {
    this.world = Sim.createWorld(); this.localId = "p1"; this.bits = 0; this.acc = 0; this.listeners = [];
    Sim.addPlayer(this.world, this.localId, "PILOT");
  }
  onEvents(fn) { this.listeners.push(fn); }
  setInput(bits) { this.bits = bits; }
  update(dt) {
    this.acc = Math.min(this.acc + dt, 0.25);
    while (this.acc >= Sim.CFG.TICK) {
      const ev = Sim.step(this.world, { [this.localId]: this.bits }, Sim.CFG.TICK);
      this.acc -= Sim.CFG.TICK;
      if (ev.length) this.listeners.forEach((fn) => fn(ev));
    }
  }
  view() { return this.world; }
  status() { return "SOLO"; }
}

// Networked play. Tries a WebSocket first; if that is blocked on the way (some proxies and
// browser policies do), falls back to HTTP long-polling against the same server.
class NetSession {
  constructor(room, name, onFail) {
    this.room = room; this.name = name; this.localId = null; this.listeners = []; this.snap = null; this.recvAt = 0;
    this.sentBits = -1; this.sentAt = 0; this.rtt = 0; this.onFail = onFail; this.closed = false; this.transport = "…";
    this.pingTimer = setInterval(() => this.send({ t: "ping", c: performance.now() }), 2000);
    this.tryWs();
  }
  tryWs() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let ws;
    try { ws = new WebSocket(`${proto}//${location.host}/ws?room=${encodeURIComponent(this.room)}&name=${encodeURIComponent(this.name)}`); }
    catch { return this.startHttp("ws-konstruktor"); }
    this.ws = ws;
    const giveUp = setTimeout(() => { if (!this.localId) { ws.onclose = null; ws.close(); this.startHttp("ws-timeout"); } }, 3000);
    ws.onmessage = (m) => { const d = JSON.parse(m.data); if (d.t === "welcome") { clearTimeout(giveUp); this.transport = "WS"; } this.onMessage(d); };
    ws.onclose = (e) => {
      clearTimeout(giveUp);
      if (this.closed) return;
      if (!this.localId && !this.error) return this.startHttp(`ws-${e.code}`); // never got in: try HTTP
      this.fail(this.error || `Anslutningen till servern bröts (WS ${e.code}).`);
    };
    ws.onerror = () => {};
  }
  async startHttp(why) {
    console.info("Shardfield: WebSocket gick inte (" + why + "), använder HTTP");
    this.ws = null;
    try {
      const r = await fetch("api/join", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ room: this.room, name: this.name }) });
      const d = await r.json();
      if (d.t === "error") return this.fail(d.msg);
      this.token = d.token; this.transport = "HTTP"; this.onMessage(d);
      addEventListener("pagehide", () => navigator.sendBeacon?.(`api/leave?token=${this.token}`));
      this.pollLoop();
    } catch (e) { this.fail(`Kunde inte nå servern (${why}, http: ${e.message}).`); }
  }
  async pollLoop() {
    let errors = 0;
    while (!this.closed) {
      try {
        const r = await fetch(`api/poll?token=${this.token}`, { cache: "no-store" });
        if (r.status === 410) return this.fail("Sessionen gick ut. Gå med igen.");
        if (!r.ok) throw new Error("HTTP " + r.status);
        for (const m of await r.json()) this.onMessage(m);
        errors = 0;
      } catch (e) {
        if (++errors > 5) return this.fail(`Anslutningen till servern bröts (${e.message}).`);
        await new Promise((res) => setTimeout(res, 300 * errors));
      }
    }
  }
  fail(msg) { if (this.closed) return; this.closed = true; clearInterval(this.pingTimer); this.onFail(msg); }
  onEvents(fn) { this.listeners.push(fn); }
  send(m) {
    if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m));
    else if (this.token && !this.closed)
      fetch(`api/send?token=${this.token}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(m), keepalive: true }).catch(() => {});
  }
  onMessage(m) {
    if (m.t === "welcome") this.localId = m.id;
    else if (m.t === "snap") {
      this.snap = Sim.decode(m.s); this.recvAt = performance.now();
      if (m.e.length) this.listeners.forEach((fn) => fn(m.e));
    } else if (m.t === "pong") this.rtt = performance.now() - m.c;
    else if (m.t === "error") this.error = m.msg;
  }
  setInput(bits) {
    if (!this.localId) return;
    const now = performance.now();
    if (bits !== this.sentBits || now - this.sentAt > 500) { // on change, plus keepalive
      this.send({ t: "in", b: bits }); this.sentBits = bits; this.sentAt = now;
    }
  }
  update() {}
  // Dead reckoning: advance the last snapshot by its age so motion stays smooth between updates.
  view(now) {
    const s = this.snap;
    if (!s) return null;
    const age = Math.min(0.1, (now - this.recvAt) / 1000);
    const mv = (o) => { const [x, y] = Sim.wrapXY(o.x + o.vx * age, o.y + o.vy * age); return { ...o, x, y }; };
    const players = {};
    for (const [id, p] of Object.entries(s.players)) players[id] = { ...p, ship: p.ship.alive ? mv(p.ship) : p.ship };
    return { ...s, players,
      rocks: s.rocks.map((r) => ({ ...mv(r), a: r.a + r.spin * age })),
      bullets: s.bullets.map(mv) };
  }
  status() {
    const n = this.snap ? Object.keys(this.snap.players).length : 0;
    return `RUM ${this.room.toUpperCase()} · ${n}/6 · ${this.transport} ${Math.round(this.rtt)} MS`;
  }
}

/* =====================================================================
   INPUT
   ===================================================================== */
const Input = (() => {
  const { IN } = Sim;
  const keyMap = { ArrowUp: IN.THRUST, KeyW: IN.THRUST, ArrowLeft: IN.LEFT, KeyA: IN.LEFT,
    ArrowRight: IN.RIGHT, KeyD: IN.RIGHT, Space: IN.FIRE, KeyK: IN.FIRE };
  let keys = 0, touch = 0, enabled = false;
  addEventListener("keydown", (e) => { if (enabled && keyMap[e.code]) { keys |= keyMap[e.code]; e.preventDefault(); } });
  addEventListener("keyup", (e) => { if (keyMap[e.code]) keys &= ~keyMap[e.code]; });
  addEventListener("blur", () => { keys = 0; touch = 0; });
  const pad = document.getElementById("pad");
  for (const btn of pad.querySelectorAll("button")) {
    const bit = +btn.dataset.bit;
    const on = (e) => { e.preventDefault(); touch |= bit; btn.classList.add("on"); };
    const off = (e) => { e.preventDefault(); touch &= ~bit; btn.classList.remove("on"); };
    btn.addEventListener("pointerdown", on);
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) btn.addEventListener(ev, off);
  }
  return {
    bits: () => (enabled ? keys | touch : 0),
    enable() { enabled = true; if (matchMedia("(pointer: coarse)").matches) pad.hidden = false; },
  };
})();

/* =====================================================================
   AUDIO
   ===================================================================== */
const Sfx = (() => {
  let ctx = null, on = false, thrustNode = null;
  const btn = document.getElementById("mute");
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { ctx = null; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
  }
  function setOn(v) { on = v; if (v) ensure(); btn.textContent = on ? "LJUD PÅ" : "LJUD AV"; if (!on) thrust(false); }
  btn.addEventListener("click", () => setOn(!on));
  function tone(freq, dur, type = "square", vol = 0.06, slide = 0) {
    if (!on || !ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol = 0.18, lp = 900) {
    if (!on || !ctx) return;
    const len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = "lowpass"; f.frequency.value = lp; g.gain.value = vol;
    src.buffer = buf; src.connect(f).connect(g).connect(ctx.destination); src.start();
  }
  function thrust(active) {
    if (!ctx) return;
    if (active && on && !thrustNode) {
      const len = ctx.sampleRate, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 260; g.gain.value = 0.07;
      src.connect(f).connect(g).connect(ctx.destination); src.start(); thrustNode = src;
    } else if ((!active || !on) && thrustNode) { thrustNode.stop(); thrustNode = null; }
  }
  return {
    enable: () => setOn(true), toggle: () => setOn(!on), thrust,
    shoot: () => tone(880, 0.09, "square", 0.03, -500),
    boom: (size) => noise(0.18 + size * 0.12, 0.1 + size * 0.04, 400 + (4 - size) * 400),
    die: () => { noise(0.8, 0.3, 600); tone(220, 0.7, "sawtooth", 0.05, -180); },
    round: () => { tone(523, 0.12, "triangle", 0.08); setTimeout(() => tone(784, 0.18, "triangle", 0.08), 120); },
    life: () => { tone(660, 0.1, "triangle", 0.07); setTimeout(() => tone(990, 0.15, "triangle", 0.07), 100); },
  };
})();

/* =====================================================================
   RENDERER — reads a world-shaped view, never writes game state
   ===================================================================== */
const Renderer = (() => {
  const { CFG } = Sim;
  const cv = document.getElementById("game"), g = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement), tok = (n) => css.getPropertyValue(n).trim();
  const C = { void: tok("--void"), field: tok("--field"), line: tok("--line"), dim: tok("--dim"), amber: tok("--amber") };
  const FD = tok("--font-display"), FM = tok("--font-mono");
  let scale = 1, ox = 0, oy = 0, particles = [], stars = [], banner = null, shake = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    scale = Math.min(cv.width / CFG.W, cv.height / CFG.H);
    ox = (cv.width - CFG.W * scale) / 2; oy = (cv.height - CFG.H * scale) / 2;
  }
  addEventListener("resize", resize); resize();
  for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * CFG.W, y: Math.random() * CFG.H, b: Math.random() });

  function burst(x, y, n, speed, color, life = 0.8, vx = 0, vy = 0) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
      particles.push({ x, y, vx: vx * 0.4 + Math.cos(a) * s, vy: vy * 0.4 + Math.sin(a) * s,
        life: life * (0.5 + Math.random() * 0.5), max: life, color, seg: Math.random() < 0.35 });
    }
  }
  function onEvents(evs, localId) {
    for (const e of evs) {
      if (e.type === "rockBreak") { burst(e.x, e.y, 6 + e.size * 5, 60 + e.size * 30, C.line, 0.7); shake = Math.max(shake, e.size * 2); }
      if (e.type === "shipDie") { burst(e.x, e.y, 40, 180, e.color, 1.3, e.vx, e.vy); if (e.id === localId) shake = 10; }
      if (e.type === "round") banner = { text: `RUNDA ${e.round}`, sub: "", t: 2 };
      if (e.type === "cleared") banner = { text: "BÄLTET RENSAT", sub: `Runda ${e.round + 1} på väg`, t: 2.4 };
      if (e.type === "gameover") banner = { text: "GAME OVER", sub: "Ny match startar", t: 4.5 };
      if (e.type === "extraLife" && e.id === localId) banner = { text: "+1 SKEPP", sub: "", t: 1.2 };
      if (e.type === "highscore") banner = { text: `TOPPLISTAN #${e.rank}`, sub: `${e.name} · ${e.score} poäng`, t: 3 };
    }
  }
  function wrapped(x, y, r, fn) {
    const xs = [0], ys = [0];
    if (x < r) xs.push(CFG.W); else if (x > CFG.W - r) xs.push(-CFG.W);
    if (y < r) ys.push(CFG.H); else if (y > CFG.H - r) ys.push(-CFG.H);
    for (const dx of xs) for (const dy of ys) { g.save(); g.translate(x + dx, y + dy); fn(); g.restore(); }
  }
  function drawShip(p, t, isMe) {
    const s = p.ship;
    if (!s.alive || (s.invulnT > 0 && Math.floor(t * 10) % 2 === 0)) return;
    wrapped(s.x, s.y, 24, () => {
      g.save(); g.rotate(s.a);
      g.strokeStyle = p.color; g.lineWidth = 1.8; g.beginPath();
      g.moveTo(18, 0); g.lineTo(-12, -11); g.lineTo(-7, 0); g.lineTo(-12, 11); g.closePath(); g.stroke();
      if (s.thrusting && Math.random() < 0.85) {
        g.beginPath(); g.moveTo(-8, -5); g.lineTo(-16 - Math.random() * 9, 0); g.lineTo(-8, 5); g.stroke();
      }
      g.restore();
      if (!isMe) { g.shadowBlur = 0; g.fillStyle = p.color; g.globalAlpha = .7; g.font = `500 11px ${FM}`;
        g.textAlign = "center"; g.textBaseline = "top"; g.fillText(p.name, 0, 22); g.globalAlpha = 1; }
    });
  }
  function drawRock(r) {
    const shape = Sim.rockShape(r.id);
    wrapped(r.x, r.y, r.r * 1.1, () => {
      g.rotate(r.a); g.strokeStyle = C.line; g.lineWidth = r.size === 1 ? 1.4 : 1.7; g.beginPath();
      const n = shape.length;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, rr = r.r * shape[i];
        i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath(); g.stroke();
    });
  }
  function hud(world, localId) {
    const players = Object.values(world.players).sort((a, b) => a.slot - b.slot);
    g.textBaseline = "top"; g.textAlign = "left";
    players.forEach((p, i) => {
      const x = 22 + i * 205, y = 18;
      g.fillStyle = p.color; g.font = `700 26px ${FD}`;
      g.fillText(String(p.score).padStart(6, "0"), x, y);
      g.font = `500 12px ${FM}`; g.fillStyle = C.dim;
      g.fillText(p.id === localId ? `${p.name} · DU` : p.name, x, y + 32);
      for (let k = 0; k < Math.min(p.lives, 8); k++) {
        g.save(); g.translate(x + 8 + k * 16, y + 58); g.rotate(-Math.PI / 2);
        g.strokeStyle = p.color; g.lineWidth = 1.3; g.beginPath();
        g.moveTo(8, 0); g.lineTo(-5, -5); g.lineTo(-3, 0); g.lineTo(-5, 5); g.closePath(); g.stroke(); g.restore();
      }
    });
    g.textAlign = "right"; g.font = `500 12px ${FM}`; g.fillStyle = C.dim;
    g.fillText(`RUNDA ${world.round}   STENAR ${world.rocks.length}`, CFG.W - 22, CFG.H - 28);
  }
  function draw(world, localId, dt, t) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = C.void; g.fillRect(0, 0, cv.width, cv.height);
    shake = Math.max(0, shake - dt * 30);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    g.setTransform(scale, 0, 0, scale, ox + sx * scale, oy + sy * scale);
    g.fillStyle = C.field; g.fillRect(0, 0, CFG.W, CFG.H);
    g.save(); g.beginPath(); g.rect(0, 0, CFG.W, CFG.H); g.clip();
    for (const s of stars) { g.fillStyle = `rgba(214,230,255,${0.12 + s.b * 0.3})`; g.fillRect(s.x, s.y, 1.4, 1.4); }
    if (world) {
      g.shadowColor = "rgba(214,230,255,.55)"; g.shadowBlur = 6;
      for (const r of world.rocks) drawRock(r);
      for (const b of world.bullets) {
        const p = world.players[b.owner];
        g.fillStyle = p ? p.color : C.line; g.beginPath(); g.arc(b.x, b.y, 2.2, 0, Math.PI * 2); g.fill();
      }
      for (const p of Object.values(world.players)) { g.shadowColor = p.color; g.shadowBlur = 6; drawShip(p, t, p.id === localId); }
      g.shadowBlur = 0;
    }
    particles = particles.filter((q) => (q.life -= dt) > 0);
    for (const q of particles) {
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.985; q.vy *= 0.985;
      g.globalAlpha = Math.max(0, q.life / q.max); g.strokeStyle = q.color; g.fillStyle = q.color; g.lineWidth = 1.2;
      if (q.seg) { g.beginPath(); g.moveTo(q.x, q.y); g.lineTo(q.x - q.vx * 0.04, q.y - q.vy * 0.04); g.stroke(); }
      else g.fillRect(q.x - 1, q.y - 1, 2, 2);
    }
    g.globalAlpha = 1; g.restore();
    g.strokeStyle = "rgba(111,127,156,.35)"; g.lineWidth = 1; g.strokeRect(0.5, 0.5, CFG.W - 1, CFG.H - 1);
    if (world) hud(world, localId);
    if (banner) {
      banner.t -= dt;
      if (banner.t <= 0) banner = null;
      else {
        g.globalAlpha = Math.min(1, banner.t * 2); g.textAlign = "center"; g.textBaseline = "middle";
        g.fillStyle = C.line; g.font = `700 54px ${FD}`; g.fillText(banner.text, CFG.W / 2, CFG.H / 2 - 12);
        if (banner.sub) { g.font = `500 15px ${FM}`; g.fillStyle = C.dim; g.fillText(banner.sub.toUpperCase(), CFG.W / 2, CFG.H / 2 + 34); }
        g.globalAlpha = 1;
      }
    }
  }
  return { draw, onEvents };
})();

/* =====================================================================
   APP
   ===================================================================== */
(() => {
  const $ = (id) => document.getElementById(id);
  const menu = $("menu"), err = $("err"), nameIn = $("nameIn"), roomIn = $("roomIn");
  const roomFromHash = () => decodeURIComponent(location.hash.slice(1)).replace(/[^\p{L}\p{N}_-]/gu, "").slice(0, 24);
  try { nameIn.value = localStorage.getItem("shardfield.name") || ""; } catch {}
  roomIn.value = roomFromHash();
  (roomIn.value ? nameIn : nameIn).focus();

  let session = null;

  /* ---- leaderboard ---- */
  const LB = { data: null, tab: "week", timer: null };
  try { LB.tab = localStorage.getItem("shardfield.lbtab") || "week"; } catch {}
  async function loadLb() {
    try { const r = await fetch("api/leaderboard", { cache: "no-store" }); if (r.ok) LB.data = await r.json(); } catch {}
    renderLb();
  }
  function renderLb() {
    const myName = (nameIn.value.trim() || "PILOT").toUpperCase();
    for (const el of [$("lbMenu"), $("lbGame")]) {
      const rows = LB.data ? LB.data[LB.tab === "week" ? "week" : "allTime"] : null;
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      el.innerHTML = `
        <div class="lb-head"><h2>Topplista</h2>
          <div class="lb-tabs" role="group" aria-label="Period">
            <button type="button" data-tab="week" aria-pressed="${LB.tab === "week"}">7 dagar</button>
            <button type="button" data-tab="all" aria-pressed="${LB.tab !== "week"}">Alla tider</button>
          </div></div>
        ${rows === null ? `<div class="empty">Topplistan kunde inte laddas.</div>`
          : rows.length === 0 ? `<div class="empty">Inga poäng ännu. Första matchen sätter rekordet.</div>`
          : `<ol>${rows.map((r, i) => `<li class="${r.name === myName ? "me" : ""}"><span class="rk">${i + 1}</span>
              <span class="nm">${esc(r.name)}</span><span class="rd">R${r.round}</span><span class="sc">${r.score}</span></li>`).join("")}</ol>`}`;
    }
  }
  for (const id of ["lbMenu", "lbGame"]) $(id).addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    LB.tab = b.dataset.tab; try { localStorage.setItem("shardfield.lbtab", LB.tab); } catch {}
    renderLb();
  });
  function toggleLbOverlay(show = $("lbOverlay").hidden) {
    $("lbOverlay").hidden = !show;
    clearInterval(LB.timer);
    if (show) { loadLb(); LB.timer = setInterval(loadLb, 5000); }
  }
  $("lbBtn").addEventListener("click", () => toggleLbOverlay());
  $("lbOverlay").addEventListener("click", (e) => { if (e.target.id === "lbOverlay") toggleLbOverlay(false); });
  addEventListener("keydown", (e) => { if (e.code === "KeyL" && session && document.activeElement.tagName !== "INPUT") toggleLbOverlay(); });
  loadLb();

  function begin(s) {
    session = s;
    s.onEvents((evs) => {
      Renderer.onEvents(evs, s.localId);
      for (const e of evs) {
        if (e.type === "shoot" && e.id === s.localId) Sfx.shoot();
        if (e.type === "rockBreak") Sfx.boom(e.size);
        if (e.type === "shipDie") Sfx.die();
        if (e.type === "round") Sfx.round();
        if (e.type === "extraLife" && e.id === s.localId) Sfx.life();
      }
    });
    menu.hidden = true; $("share").hidden = false; $("copy").hidden = !(s instanceof NetSession);
    Input.enable(); Sfx.enable();
  }
  function fail(msg) {
    loadLb();
    session = null; menu.hidden = false; $("share").hidden = true; err.textContent = msg;
  }

  $("joinForm").addEventListener("submit", (e) => {
    e.preventDefault(); err.textContent = "";
    const name = nameIn.value.trim() || "PILOT";
    const room = roomIn.value.trim().toLowerCase().replace(/[^\p{L}\p{N}_-]/gu, "") || "lobby";
    try { localStorage.setItem("shardfield.name", name); } catch {}
    history.replaceState(null, "", "#" + encodeURIComponent(room));
    begin(new NetSession(room, name, fail));
  });
  $("soloBtn").addEventListener("click", () => begin(new LocalSession()));
  $("copy").addEventListener("click", async () => {
    const btn = $("copy");
    try { await navigator.clipboard.writeText(location.href); btn.textContent = "KOPIERAD"; }
    catch { btn.textContent = location.href; }
    setTimeout(() => (btn.textContent = "KOPIERA LÄNK"), 1600);
  });
  addEventListener("keydown", (e) => { if (e.code === "KeyM" && session && document.activeElement.tagName !== "INPUT") Sfx.toggle(); });

  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt;
    let view = null;
    if (session) {
      session.setInput(Input.bits());
      session.update(dt);
      view = session.view(now);
      $("net").textContent = session.status();
      const me = view && view.players[session.localId];
      Sfx.thrust(!!(me && me.ship.alive && me.ship.thrusting));
    }
    Renderer.draw(view, session && session.localId, dt, t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
